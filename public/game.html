<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Athena Temple Run — 3D (three.js)</title>
  <style>
    :root{ --gold:#d4af37; --bg:#0b0f1a; }
    html,body{ height:100%; }
    body{ margin:0; overflow:hidden; background:radial-gradient(120% 100% at 50% 0%, #1a2334 0%, var(--bg) 60%, #06080f 100%); color:#fff; font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; }
    canvas{ display:block; }
    .hud{ position:fixed; inset:0; pointer-events:none; display:grid; grid-template-rows:auto 1fr auto; }
    .row{ display:flex; gap:12px; align-items:center; padding:12px; }
    .left{ justify-content:flex-start; }
    .right{ justify-content:flex-end; }
    .badge{ pointer-events:auto; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.12); padding:8px 12px; border-radius:999px; backdrop-filter:blur(6px); }
    .badge strong{ color:var(--gold); }
    .button{ pointer-events:auto; background:linear-gradient(180deg,#f6d879,#c99f2d); color:#2a2210; border:none; padding:10px 16px; border-radius:12px; font-weight:800; letter-spacing:.3px; cursor:pointer; box-shadow:0 10px 30px rgba(212,175,55,.25); }
    .screen{ position:fixed; inset:0; display:grid; place-items:center; padding:24px; background:linear-gradient(180deg, rgba(10,12,20,.55), rgba(10,12,20,.9)); backdrop-filter:blur(6px); }
    .card{ width:min(900px,92vw); border-radius:16px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); box-shadow:0 30px 80px rgba(0,0,0,.35); overflow:hidden; text-align:center; }
    .title{ font-size:clamp(28px,4vw,44px); margin:18px 0 6px; font-weight:900; text-transform:uppercase; }
    .subtitle{ opacity:.9; font-size:14px; margin-bottom:16px; }
    .footer{ padding:16px; }
    .kbd{ font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono"; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.15); padding:4px 7px; border-radius:10px; font-size:12px; }
    .hint{ pointer-events:none; position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.15); padding:8px 12px; border-radius:999px; font-size:12px; }
  </style>
</head>
<body>
  <canvas id="three"></canvas>

  <div class="hud">
    <div class="row left">
      <div class="badge">Score: <strong id="score">0</strong></div>
      <div class="badge">Owls: <strong id="owls">0</strong> 🦉</div>
      <div class="badge">Speed: <strong id="speed">0</strong></div>
    </div>
    <div></div>
    <div class="row right">
      <button class="button" id="pauseBtn">Pause</button>
    </div>
  </div>

  <div class="screen" id="startScreen">
    <div class="card">
      <div class="title">Temple Run: <span style="color:var(--gold)">Athena 3D</span></div>
      <div class="subtitle">Three.js endless runner. Switch lanes, jump hazards, and collect owl coins as the speed ramps up.</div>
      <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap; opacity:.9; padding:0 16px 8px;">
        <span class="kbd">←/A</span> left
        <span class="kbd">→/D</span> right
        <span class="kbd">↑/W/Space</span> jump
        <span class="kbd">P</span> pause
        <span class="kbd">Swipe</span> on mobile
      </div>
      <div class="footer"><button class="button" id="startBtn">Start Run</button></div>
    </div>
  </div>

  <div class="screen" id="gameOver" style="display:none;">
    <div class="card">
      <div class="title" style="font-size: clamp(40px,6vw,80px);">Ouch!</div>
      <div class="subtitle">You stumbled before Athena. Try again.</div>
      <div class="footer"><button class="button" id="retryBtn">Run Again</button></div>
    </div>
  </div>

  <div class="hint" id="hint">Swipe or use arrow keys</div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'https://unpkg.com/three@0.160.0/examples/jsm/environments/RoomEnvironment.js';
    import { EffectComposer } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js';

    // ---------- Renderer / Scene / Camera ----------
    const canvas = document.getElementById('three');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0b0f1a, 20, 95);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 220);
    camera.position.set(0, 3.1, 8.5);

    function resize(){
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
      composer.setSize(window.innerWidth, window.innerHeight);
      bloomPass.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', resize);

    // ---------- Environment lighting (sexy reflections) ----------
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

    // ---------- Lights ----------
    const hemi = new THREE.HemisphereLight(0xcad8ff, 0x0a0a0a, 0.7);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(0xfff2c8, 1.35); key.position.set(-6, 8, 6);
    key.castShadow = true; key.shadow.mapSize.set(1024,1024); key.shadow.camera.near = 1; key.shadow.camera.far = 40;
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x88b6ff, 0.7); rim.position.set(6, 6, -4); scene.add(rim);

    // ---------- Postprocessing (bloom for coins/temple highlights) ----------
    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.7, 0.9, 0.85);
    composer.addPass(renderPass); composer.addPass(bloomPass);

    // Layers for bloom
    const BLOOM_LAYER = 1;

    // ---------- Constants ----------
    const LANES = [-2.6, 0, 2.6];
    const WORLD_SPEED_START = 10; // units/s
    let worldSpeed = WORLD_SPEED_START;

    // ---------- Ground (looping tiles with bevels) ----------
    const matGround = new THREE.MeshStandardMaterial({ color:0x1b2234, roughness:.85, metalness:.05 });
    const matLane = new THREE.MeshStandardMaterial({ color:0x232b40, roughness:.75, metalness:.1 });
    const tileLen = 70, tileW = 14, tileH = 0.24;
    function makeGroundTile(z){
      const g = new THREE.Group();
      const base = new THREE.Mesh(new THREE.BoxGeometry(tileW, tileH, tileLen), matGround);
      base.position.y = -0.1; base.castShadow = false; base.receiveShadow = true; g.add(base);
      for (let i=0;i<3;i++){
        const lane = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.03, tileLen), matLane); lane.position.set(LANES[i], 0, 0); lane.receiveShadow = true; g.add(lane);
      }
      g.position.z = z; scene.add(g); return g;
    }
    const groundA = makeGroundTile(-tileLen*0.5);
    const groundB = makeGroundTile(-tileLen*1.5);
    function updateGround(dt){
      [groundA, groundB].forEach(t => t.position.z += worldSpeed*dt);
      if (groundA.position.z > tileLen*0.5) groundA.position.z -= tileLen*2;
      if (groundB.position.z > tileLen*0.5) groundB.position.z -= tileLen*2;
    }

    // ---------- Side colonnade (marble columns) ----------
    const matPillar = new THREE.MeshStandardMaterial({ color:0xe0dbd0, roughness:.5, metalness:.05 });
    const colGroup = new THREE.Group(); scene.add(colGroup);
    (function buildColumns(){
      const colGeom = new THREE.CylinderGeometry(0.25, 0.25, 3.2, 24);
      for (let side of [-1,1]){
        for (let i=0;i<26;i++){
          const m = new THREE.Mesh(colGeom, matPillar); m.position.set(side*(tileW/2-0.9), 1.6, -i*3.2);
          m.castShadow = true; m.receiveShadow = true; colGroup.add(m);
        }
      }
    })();
    function updateColumns(dt){ colGroup.position.z += worldSpeed*dt; if (colGroup.position.z > 3.2) colGroup.position.z -= 3.2; }

    // ---------- Distant temple with glow ----------
    const temple = new THREE.Group();
    (function(){
      const marble = new THREE.MeshStandardMaterial({ color:0xcfc8bb, roughness:.65, metalness:.05, emissive:0x332a1a, emissiveIntensity:.05 });
      const roof = new THREE.Mesh(new THREE.ConeGeometry(5.5, 2, 4), marble);
      roof.rotation.y = Math.PI/4; roof.position.set(0, 3.8, -52); roof.layers.enable(BLOOM_LAYER);
      const base = new THREE.Mesh(new THREE.BoxGeometry(10, 0.4, 2), marble);
      base.position.set(0, 1.0, -52);
      temple.add(roof, base);
      const cgeom = new THREE.CylinderGeometry(0.22, 0.22, 2, 18);
      for (let i=-4;i<=4;i++){ const c = new THREE.Mesh(cgeom, matPillar); c.position.set(i*1.1, 2, -52); temple.add(c); }
      scene.add(temple);
    })();

    // ---------- Human runner (GLTF) ----------
    const playerGroup = new THREE.Group(); scene.add(playerGroup);
    let runner = null, runnerMixer = null, runnerReady = false;
    const loader = new GLTFLoader();
    // Public CC-friendly sample with Run animation
    const RUNNER_URL = 'https://unpkg.com/@3d-dice/assets@1.0.3/threejs/Soldier.glb'; // fallback to threejs examples mirror if needed

    loader.load(RUNNER_URL, (gltf)=>{
      runner = gltf.scene;
      runner.scale.set(1.1,1.1,1.1);
      runner.traverse(o=>{ if(o.isMesh){ o.castShadow = true; o.receiveShadow = false; o.frustumCulled = false; } });
      runner.position.set(0, 0, 0);
      playerGroup.add(runner);
      if (gltf.animations && gltf.animations.length){
        runnerMixer = new THREE.AnimationMixer(runner);
        const runClip = gltf.animations.find(a=>/run/i.test(a.name)) || gltf.animations[gltf.animations.length-1];
        const act = runnerMixer.clipAction(runClip); act.timeScale = 1.2; act.play();
      }
      runnerReady = true;
    }, undefined, (err)=>{
      // Fallback: capsule body if model fails
      const fallback = new THREE.Mesh(new THREE.CapsuleGeometry(0.35,0.9,8,16), new THREE.MeshStandardMaterial({ color:0xead28b, emissive:0x5a4a18, emissiveIntensity:.35 }));
      fallback.position.y = 1.2; fallback.castShadow = true; playerGroup.add(fallback);
      runnerReady = true;
    });

    // Soft ground shadow under player
    const playerShadow = new THREE.Mesh(new THREE.CircleGeometry(0.6, 24), new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:.28 }));
    playerShadow.rotation.x = -Math.PI/2; playerShadow.position.y = 0.011; playerGroup.add(playerShadow);

    let targetLane = 1; // 0..2
    let isJumping = false, jumpT = 0; const JUMP_DUR = 0.55;

    function setLane(i){ targetLane = Math.max(0, Math.min(2, i)); }
    function jump(){ if (!isJumping){ isJumping = true; jumpT = 0; cameraKick(0.06); } }

    function updatePlayer(dt){
      // lane lerp
      const targetX = LANES[targetLane];
      playerGroup.position.x = THREE.MathUtils.damp(playerGroup.position.x, targetX, 10, dt);
      // jump arc
      if (isJumping){
        jumpT += dt; const t = Math.min(1, jumpT / JUMP_DUR); const lift = Math.sin(t*Math.PI) * 1.45;
        const yBase = 1.05; // runner hips
        if (runner) runner.position.y = yBase + lift; // animate hips
        playerShadow.scale.setScalar(THREE.MathUtils.lerp(1, 0.6, lift/1.45));
        if (t>=1){ isJumping=false; if (runner) runner.position.y = yBase; playerShadow.scale.setScalar(1); }
      }
      if (runnerMixer) runnerMixer.update(dt);
    }

    // ---------- Particles: gold sparks on coins + road dust ----------
    const sparkGeo = new THREE.SphereGeometry(0.03, 6, 6);
    const sparkMat = new THREE.MeshBasicMaterial({ color:0xffe08a });
    function burst(x,y,z){
      for (let i=0;i<8;i++){
        const m = new THREE.Mesh(sparkGeo, sparkMat); m.position.set(x,y,z); m.layers.enable(BLOOM_LAYER);
        const vx = (Math.random()-0.5)*1.6, vy = Math.random()*1.6, vz = (Math.random()-0.5)*1.6;
        const life = 0.35 + Math.random()*0.25; particles.push({ m, vx, vy, vz, life }); scene.add(m);
      }
    }
    const particles = [];
    function updateParticles(dt){
      for (let i=particles.length-1;i>=0;i--){
        const p = particles[i]; p.life -= dt; if (p.life<=0){ scene.remove(p.m); particles.splice(i,1); continue; }
        p.m.position.x += p.vx*dt; p.m.position.y += p.vy*dt; p.m.position.z += p.vz*dt; p.m.material.opacity = Math.max(0, p.life*2);
      }
    }

    // ---------- Obstacles & Coins ----------
    const obstacles = []; // {mesh, lane, type}
    const coins = [];     // {mesh, lane}
    const spikeGeom = new THREE.ConeGeometry(0.5, 1.1, 18);
    const pillarGeom = new THREE.CylinderGeometry(0.5, 0.5, 1.4, 24);
    const matSpike = new THREE.MeshStandardMaterial({ color:0xa73b3b, roughness:.6, metalness:.2 });
    const coinGeom  = new THREE.TorusGeometry(0.38, 0.12, 14, 26);
    const matCoin   = new THREE.MeshStandardMaterial({ color:0xd4af37, roughness:.25, metalness:.85, emissive:0x2a1e07, emissiveIntensity:.22 });

    function spawnObstacle(){
      const lane = (Math.random()*3)|0; const type = Math.random()<0.7 ? 'pillar' : 'spike';
      const mesh = new THREE.Mesh(type==='pillar'?pillarGeom:spikeGeom, type==='pillar'?matPillar:matSpike);
      mesh.position.set(LANES[lane], type==='pillar'?0.7:0.55, -75 - Math.random()*35);
      mesh.rotation.y = Math.random()*Math.PI; mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh);
      obstacles.push({ mesh, lane, type });
    }
    function spawnCoin(){
      const lane = (Math.random()*3)|0; const mesh = new THREE.Mesh(coinGeom, matCoin);
      mesh.position.set(LANES[lane], 1.3, -68 - Math.random()*28); mesh.rotation.x = Math.PI/2; mesh.layers.enable(BLOOM_LAYER); scene.add(mesh);
      coins.push({ mesh, lane });
    }

    function updateEntities(dt){
      const vz = worldSpeed*dt;
      for (let i=obstacles.length-1;i>=0;i--){ const o=obstacles[i]; o.mesh.position.z += vz; if (o.mesh.position.z>10){ scene.remove(o.mesh); obstacles.splice(i,1); } }
      for (let i=coins.length-1;i>=0;i--){ const c=coins[i]; c.mesh.position.z += vz; c.mesh.rotation.z += dt*5; if (c.mesh.position.z>10){ scene.remove(c.mesh); coins.splice(i,1); } }
    }

    // ---------- Camera polish (slight sway, FOV kick) ----------
    let camTime = 0, fovKick = 0;
    function updateCamera(dt){
      camTime += dt*2.5; const sway = Math.sin(camTime)*0.02;
      camera.position.x = THREE.MathUtils.damp(camera.position.x, playerGroup.position.x*0.25 + sway, 4, dt);
      camera.position.y = THREE.MathUtils.damp(camera.position.y, 3.1 + (isJumping?0.15:0), 3, dt);
      camera.lookAt(playerGroup.position.x, 1.4, 0);
      if (fovKick>0){ fovKick = Math.max(0, fovKick - dt*1.5); camera.fov = 60 + fovKick*8; camera.updateProjectionMatrix(); }
    }
    function cameraKick(intensity=0.08){ fovKick = Math.min(1, fovKick + intensity); }

    // ---------- Collisions ----------
    const boxPlayer = new THREE.Box3(); const boxTemp = new THREE.Box3();
    function checkCollisions(){
      boxPlayer.setFromCenterAndSize(new THREE.Vector3(playerGroup.position.x, 1.2, 0), new THREE.Vector3(0.8, 1.6, 0.8));
      for (let i=obstacles.length-1;i>=0;i--){ const o=obstacles[i]; boxTemp.setFromObject(o.mesh);
        if (boxPlayer.intersectsBox(boxTemp)){
          if (o.type==='spike' && isJumping && (runner?runner.position.y:1.2)>1.65) continue; // hop spikes
          return true;
        }
      }
      for (let i=coins.length-1;i>=0;i--){ const c=coins[i]; boxTemp.setFromObject(c.mesh); if (boxPlayer.intersectsBox(boxTemp)){ burst(c.mesh.position.x, c.mesh.position.y, c.mesh.position.z); scene.remove(c.mesh); coins.splice(i,1); gainCoin(); } }
      return false;
    }

    // ---------- UI & Game State ----------
    const ui = {
      score: document.getElementById('score'),
      owls: document.getElementById('owls'),
      speed: document.getElementById('speed'),
      start: document.getElementById('startScreen'),
      over: document.getElementById('gameOver'),
      startBtn: document.getElementById('startBtn'),
      retryBtn: document.getElementById('retryBtn'),
      pauseBtn: document.getElementById('pauseBtn'),
      hint: document.getElementById('hint'),
    };

    let state = 'menu';
    let score = 0, coinCount = 0, time = 0, spawnT = 0, coinT = 0;

    function reset(){
      obstacles.splice(0).forEach(o=>scene.remove(o.mesh));
      coins.splice(0).forEach(c=>scene.remove(c.mesh));
      particles.splice(0).forEach(p=>scene.remove(p.m));
      groundA.position.z = -tileLen*0.5; groundB.position.z = -tileLen*1.5; colGroup.position.z = 0;
      playerGroup.position.set(0,0,0); if (runner) runner.position.y=1.05; playerShadow.scale.setScalar(1);
      targetLane=1; isJumping=false; jumpT=0; worldSpeed=WORLD_SPEED_START; score=0; coinCount=0; time=0; spawnT=0; coinT=0; updateHUD();
    }
    function updateHUD(){ ui.score.textContent = Math.floor(score).toLocaleString(); ui.owls.textContent = coinCount.toString(); ui.speed.textContent = worldSpeed.toFixed(1)+' u/s'; }
    function gainCoin(){ coinCount++; score+=24; cameraKick(0.03); updateHUD(); }
    function start(){ reset(); state='running'; ui.start.style.display='none'; ui.over.style.display='none'; }
    function gameOver(){ state='over'; ui.over.style.display='grid'; }

    ui.startBtn.onclick = start; ui.retryBtn.onclick = start;
    ui.pauseBtn.onclick = ()=>{ if(state==='running') state='paused'; else if(state==='paused') state='running'; };

    // ---------- Input ----------
    function moveLeft(){ setLane(targetLane-1); }
    function moveRight(){ setLane(targetLane+1); }
    window.addEventListener('keydown', (e)=>{
      if (state==='menu') return;
      if (e.key==='ArrowLeft' || e.key==='a' || e.key==='A') moveLeft();
      if (e.key==='ArrowRight' || e.key==='d' || e.key==='D') moveRight();
      if (e.key==='ArrowUp' || e.key==='w' || e.key==='W' || e.key===' '){ e.preventDefault(); jump(); }
      if (e.key==='p' || e.key==='P') ui.pauseBtn.click();
    });
    let tStartX=0, tStartY=0, touching=false;
    window.addEventListener('touchstart', (e)=>{ const t=e.changedTouches[0]; touching=true; tStartX=t.clientX; tStartY=t.clientY; });
    window.addEventListener('touchend', (e)=>{ if(!touching) return; touching=false; const t=e.changedTouches[0]; const dx=t.clientX-tStartX, dy=t.clientY-tStartY; if (Math.abs(dx)>Math.abs(dy)){ if (dx>30) moveRight(); else if (dx<-30) moveLeft(); } else { if (dy<-30) jump(); } });
    setTimeout(()=>{ ui.hint.style.opacity=0; ui.hint.style.transition='opacity .6s ease'; }, 3000);

    // ---------- Main Loop ----------
    const clock = new THREE.Clock();
    function frame(){
      requestAnimationFrame(frame);
      const dt = Math.min(0.033, clock.getDelta());
      if (state==='running'){
        time += dt; score += worldSpeed*dt*0.9; worldSpeed += 0.75*dt; // gentle ramp
        spawnT -= dt; coinT -= dt;
        if (spawnT<=0){ spawnObstacle(); spawnT = Math.max(0.45, 1.2 - time*0.04); }
        if (coinT<=0){ spawnCoin(); coinT = Math.max(0.25, 0.8 - time*0.03); }
        updateGround(dt); updateColumns(dt); updateEntities(dt); updatePlayer(dt); updateParticles(dt); updateCamera(dt);
        if (checkCollisions()) gameOver();
        updateHUD();
      } else {
        updateCamera(dt); // keep subtle sway on menu
      }
      composer.render();
    }
    frame();

    // start in menu
  </script>
</body>
</html>
